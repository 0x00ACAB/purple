[workspace]
resolver = "3"
members = ["crates/*"]
# Patched third-party code; see [patch.crates-io] below.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
# libsignal is AGPL, so purple is too.
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
async-trait = "0.1"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
crossterm = { version = "0.29", features = ["use-dev-tty"] }
futures-executor = "0.3"
hkdf = "0.12"
hmac = "0.12"
landlock = "0.4"
libc = "0.2"
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.106.1" }
# Groups. Only the libcrux backend has the X-Wing suite.
openmls = { version = "0.9.2", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_libcrux_crypto = { version = "0.4.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_memory_storage = { version = "0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_traits = { version = "0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
serde_json = "1.0.154"
# Must match the rand major version libsignal-protocol uses.
rand = "0.9"
# line_count gives the exact wrapped height, so long chat messages stay scrolled to the end.
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
seccompiler = "0.5"
sha2 = "0.10"
snow = "0.9"
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdh"] }
zeroize = "1"
purple-harden = { path = "crates/purple-harden" }
purple-ipc = { path = "crates/purple-ipc" }

[workspace.lints.rust]
# Every unsafe operation is opted into explicitly with #[expect(unsafe_code, reason = "...")].
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
non_ascii_idents = "deny"
unused_must_use = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
let_underscore_drop = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Panics: errors are returned, never unwrapped. clippy.toml relaxes these in tests.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
exit = "deny"
# Silent truncation and overflow.
as_conversions = "deny"
arithmetic_side_effects = "deny"
# Unsafe hygiene.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
mem_forget = "deny"
# Lint suppressions must say why.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Misc.
let_underscore_must_use = "deny"
string_slice = "deny"
wildcard_enum_match_arm = "warn"
shadow_unrelated = "warn"
unwrap_in_result = "warn"
# Contradicts rustc's unreachable_pub in binary crates; unreachable_pub wins.
redundant_pub_crate = "allow"

[profile.release]
# Overflow panics (then aborts) instead of wrapping silently.
overflow-checks = true
panic = "abort"
lto = true
codegen-units = 1
strip = "symbols"

# libcrux-ml-kem 0.0.10's incremental API (used by libsignal's SPQR) still imports
# rand 0.9's trait names, so it breaks once OpenMLS turns on its "rand" feature. libsignal
# pins exactly 0.0.10. The vendored copy renames those imports and changes nothing else.
[patch.crates-io]
libcrux-ml-kem = { path = "vendor/libcrux-ml-kem-0.0.10" }
